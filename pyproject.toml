[project]
name = "ai-server"
version = "0.1.0"
description = "Personal assistant server for Mac Mini: Telegram + web + cron → Claude Agent SDK."
requires-python = ">=3.12"
dependencies = [
    # Claude Agent SDK — the brain. Floor is the VERIFIED version: session.py
    # imports RateLimitEvent at module load and uses structured_output +
    # AgentDefinition.effort=xhigh, so an older resolve would crash on import
    # or regress. The 0.2.x line exists — upgrade deliberately, with its own
    # test pass, never as a side effect (docs/SDK_MIGRATION_2026-07-27.md).
    "claude-agent-sdk>=0.1.81,<0.2",
    # mcp 2.0.0 removed the 1.x lowlevel Server API (Server.list_tools) that
    # claude-agent-sdk 0.1.x's create_sdk_mcp_server bridge calls — with mcp 2
    # installed, every needs-dispatch-mcp / needs-projects-mcp session dies with
    # "'Server' object has no attribute 'list_tools'" (prod incident 2026-07-30;
    # a routine re-lock pulled 2.0.0 because the SDK's own pin, mcp>=1.19.0,
    # has no upper bound).
    # Drop this pin only together with the deliberate SDK 0.2.x migration.
    "mcp<2",

    # Database
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",

    # Redis (queue + pubsub)
    "redis>=5.0.3",

    # Web gateway
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",

    # Telegram gateway
    "python-telegram-bot>=21.0",

    # Scheduler
    "croniter>=2.0.5",

    # Manifest parsing
    "pyyaml>=6.0.1",

    # Logging
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.4.0",
    "fakeredis>=2.22.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
