# .context/PROJECTS_INDEX.yml — the combined project index.
#
# ONE machine-readable map of every project the ai-server hosts or tracks:
# where its code lives, whether it is live, which launchd units run it, which
# ports and hostnames it owns, how it deploys and how to check it is healthy,
# and where its manifest.yml (the per-project deploy contract) actually lives.
#
# It is an INDEX, not a second source of truth. The authorities stay where
# they are and this file must agree with them:
#   - projects/<slug>/manifest.yml   — the deploy contract (src/registry/manifest.py)
#   - projects/_ports.yml            — port allocation (never reuse a port)
#   - .context/PROJECTS_REGISTRY.md  — human-readable registry
#   - Caddyfile.d/<slug>.conf        — hostname → port routing
# `python scripts/check_projects_index.py` checks that they agree (duplicate
# ports/hostnames, registry or port-file entries missing from the index,
# Caddy snippets that point at the wrong port, manifest drift). On the Mini it
# reads projects/<slug>/manifest.yml directly; elsewhere pass
# `--manifest <slug>=<path>` for any manifest you have a copy of.
#
# Field notes:
#   status        live | retired | content (not hosted, no deploy)
#   access        public | cf-access (Cloudflare Access gated) | mixed
#   topology      dev-repo | in-place | content   (manifest delivery.topology)
#   manifest.location
#                 github   — committed in the project's canonical repo, readable
#                            from GitHub by any machine
#                 mini     — exists only in projects/<slug>/ on the Mac mini
#                            (local-only repo, or a repo this index's author
#                            could not read); a fresh machine cannot see it
#                 none     — the project has no manifest (content projects)
#   verified      what the values below were checked against, and when.
#                 "registry" = .context/PROJECTS_REGISTRY.md; "manifest" = the
#                 manifest itself. Anything not checked against the manifest is
#                 a claim from docs and should be confirmed on the Mini with
#                 `python scripts/check_projects_index.py` (it reads the real
#                 manifests there).
#   deploy.command
#                 what to send (Telegram `/task …`) to deploy it. Deploys are
#                 always their own step; a patch session never deploys.
#   health.command
#                 a local probe to run ON THE MINI (loopback port + manifest
#                 healthcheck path). Expect HTTP 200.
#
# Keep it current: when a project is added, retired, re-homed or re-ported,
# update this file in the same change as _ports.yml / the registry, then run
# the check.

version: 1
updated: "2026-11-21"
domain: chrispiserchia.com

# The server itself. Listed so port and hostname uniqueness covers it.
core:
  name: ai-server
  repo: github.com/Piserchia/ai-server
  branch: main
  dev_clone: ~/Documents/repos/ai-server
  runtime_clone: "~/Library/Application Support/ai-server"
  ports:
    - port: 8080
      service: web-gateway
      launchd: com.assistant.web
  hostnames:
    - host: chrispiserchia.com
      port: 8080            # /api/* only; everything else is the static landing page
    - host: dashboard.chrispiserchia.com
      port: 8080
    - host: health.chrispiserchia.com
      port: 8080            # only /health (Caddyfile.d/health.conf)
  launchd:
    - com.assistant.runner
    - com.assistant.web
    - com.assistant.bot
    - com.assistant.caddy
    - com.assistant.healthcheck-all
    - com.assistant.backup
    - com.assistant.sync-learnings
  deploy:
    command: "/task deploy server"
    skill: server-deploy
  health:
    command: "curl -fsS http://127.0.0.1:8080/health"

projects:
  - slug: atlas
    name: Atlas
    status: live
    type: service
    repo: github.com/Piserchia/atlas
    branch: master
    topology: dev-repo
    dev_clone: ~/Documents/repos/atlas
    runtime_clone: projects/atlas          # pull-only
    hostname: atlas.chrispiserchia.com
    access: cf-access
    port: 8791
    healthcheck: /
    services:
      - name: atlas
        launchd: com.assistant.project.atlas
        port: 8791
        start: ./scripts/start-web.sh
      - name: atlas-dash-scheduler
        launchd: com.assistant.project.atlas-dash-scheduler
        port: null                         # portless
        start: ./scripts/start-dash-scheduler.sh
      - name: atlas-pm-edge
        launchd: com.assistant.project.atlas-pm-edge
        port: null                         # portless
        start: ./scripts/start-pmedge.sh
    deploy:
      skill: atlas-redeploy
      autonomy: gated-auto
      command: "/task redeploy atlas"
      migrate: "dbmate --migrations-dir db/migrations up"
    health:
      command: "curl -fsS -o /dev/null -w '%{http_code}\\n' http://127.0.0.1:8791/"
    manifest:
      location: github
      path: github.com/Piserchia/atlas/blob/master/manifest.yml
    verified: "manifest (GitHub master), registry, _ports.yml, Caddyfile.d — 2026-11-21"

  - slug: baseball-bingo
    name: Baseball Bingo
    status: live
    type: service
    repo: github.com/Piserchia/baseball-bingo
    branch: main
    topology: in-place                     # dev-repo promotion pending (owner call)
    dev_clone: null
    runtime_clone: projects/baseball-bingo # writable (in-place)
    hostname: bingo.chrispiserchia.com
    access: public
    port: 8790
    healthcheck: /healthz
    services:
      - name: baseball-bingo
        launchd: com.assistant.project.baseball-bingo
        port: 8790
        start: "uvicorn web.main:app (via the ai-server venv; sources project .env)"
    deploy:
      skill: app-patch                     # no delivery block yet; project-redeploy refuses it
      autonomy: none
      command: "/task app-patch baseball-bingo (inline restart) — no gated deploy until a delivery block exists"
      migrate: null
    health:
      command: "curl -fsS http://127.0.0.1:8790/healthz"
    manifest:
      location: mini
      path: projects/baseball-bingo/manifest.yml
      note: "May also be committed in Piserchia/baseball-bingo; that repo was not readable when this index was written."
    verified: "registry, _ports.yml, Caddyfile.d, hosting CHANGELOG — 2026-11-21 (manifest not seen)"

